[project]
name = "northstar-trading"
version = "0.1.0"
description = "Auditable US equity research, monitoring and paper execution"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "httpx>=0.28,<1", "pandas>=2.2,<3", "exchange-calendars>=4.10,<5",
  "pydantic-settings>=2.7,<3", "python-dotenv>=1.0,<2", "jsonschema>=4.23,<5",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2"
]
[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]
research = [
    "matplotlib>=3.9,<4",
]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
[tool.setuptools.packages.find]
where = ["backend"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
